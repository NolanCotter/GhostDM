<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>GhostDM</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0b0f;
        color: white;
      }

      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }

      p,
      label,
      .fingerprint,
      .status {
        color: #a1a1aa;
        font-size: 12px;
        line-height: 1.4;
      }

      p {
        margin: 0 0 14px;
      }

      label {
        display: block;
        margin-top: 14px;
        font-weight: 700;
        color: #e4e4e7;
      }

      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 10px;
        border: 1px solid #27272a;
        padding: 10px;
        margin-top: 8px;
        background: #18181b;
        color: white;
      }

      textarea {
        min-height: 74px;
        resize: vertical;
        font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      textarea:focus,
      button:focus {
        outline: 2px solid #67e8f9;
        outline-offset: 2px;
      }

      button {
        cursor: pointer;
        font-weight: 700;
        background: white;
        color: black;
      }

      .secondary {
        background: transparent;
        color: #e4e4e7;
      }

      .fingerprint {
        margin-top: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow-wrap: anywhere;
      }

      .status {
        margin-top: 12px;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <h1>GhostDM</h1>
    <p>Exchange public pairing codes, then encrypt Instagram Web DMs locally.</p>

    <label for="pairing-code">Your pairing code</label>
    <textarea id="pairing-code" readonly></textarea>
    <button id="copy">Copy pairing code</button>
    <div class="fingerprint" id="own-fingerprint">Your fingerprint: loading</div>

    <label for="peer-code">Their pairing code</label>
    <textarea id="peer-code" placeholder="Paste their GhostDM pairing code"></textarea>
    <button id="save-peer">Save peer key</button>
    <button class="secondary" id="clear-peer">Clear peer key</button>
    <div class="fingerprint" id="peer-fingerprint">Peer fingerprint: not paired</div>

    <div class="status" id="status">Loading keys.</div>

    <script src="popup.js"></script>
  </body>
</html>
