<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>GhostDM</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0b0f;
        color: white;
      }

      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }

      p {
        color: #a1a1aa;
        font-size: 13px;
        line-height: 1.4;
        margin: 0 0 14px;
      }

      input,
      button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid #27272a;
        padding: 10px;
        margin-top: 10px;
        background: #18181b;
        color: white;
      }

      input:focus,
      button:focus {
        outline: 2px solid #67e8f9;
        outline-offset: 2px;
      }

      button {
        cursor: pointer;
        font-weight: 700;
        background: white;
        color: black;
      }

      .secondary {
        background: transparent;
        color: #e4e4e7;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #a1a1aa;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <h1>GhostDM</h1>
    <p>Encrypt Instagram Web DM text before sending. Decrypt GhostDM messages locally.</p>

    <input id="passphrase" type="password" placeholder="Shared passphrase" />
    <button id="save">Save passphrase</button>
    <button class="secondary" id="clear">Clear passphrase</button>

    <div class="status" id="status">Not configured.</div>

    <script src="popup.js"></script>
  </body>
</html>
